version: '3.5'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      # Lozinka se cita iz .env (Docker Compose ga sam ucitava iz ovog foldera).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-docker-postgres
    # .env se ucitava pri svakom pokretanju kontejnera, pa izmene u njemu
    # (npr. JWT_SECRET, CLIENT_URL) vaze bez ponovnog build-a slike.
    env_file:
      - .env
    environment:
      - PORT=${PORT}
    ports:
      - '3000:3000'
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./uploads:/usr/src/app/uploads

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: nest-pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=pgadmin4
    ports:
      - '5050:80'
    depends_on:
      - db