<div class="search-form">
  <div class="container">
    <div class="search-form-content">
      <form (ngSubmit)="handleSubmit($event)">
        <div class="search-form-elem flex flex-sb bg-white">
          <input
            type="text"
            class="form-control"
            placeholder="Naruto, One Piece..."
            #searchTextRef
          />
          <button type="submit" class="flex flex-c"></button>
        </div>
      </form>
    </div>
  </div>
</div>
